<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Rules Preview</title>
<link rel="stylesheet" href="css/base-variables.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/layout-chrome.css">
<link rel="stylesheet" href="css/overlays-modals.css">
<style>
  body { padding: 24px; max-width: 860px; margin: 0 auto; background: var(--bg); }
  .preview-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .preview-toolbar h1 { font-size: 14px; margin: 0; color: var(--text); }
  .preview-toolbar button { cursor: pointer; }
  /* Variation-only styles (not production) */
  .colrule-target-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .colrule-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .colrule-cond { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .colrule-cond .st-select.field { width: 150px; flex-shrink: 0; }
  .colrule-cond .st-select.op { width: 110px; flex-shrink: 0; }
  .colrule-cond .st-input { flex: 1 1 120px; min-width: 110px; }
  .colrule-match { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .colrule-match button { background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600; padding: 5px 12px; cursor: pointer; }
  .colrule-match button.active { background: var(--primary); color: var(--primary-text); }
  .colrule-summary { font-size: 11.5px; color: var(--text-sub); margin: 10px 0; }
  .colrule-summary strong { color: var(--text); }
  .colrule-add-link { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 6px 10px; cursor: pointer; width: 100%; margin-bottom: 4px; }
  .colrule-add-link:hover { color: var(--text); border-color: var(--accent); }
  .colrule-del { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); cursor: pointer; border-radius: 4px; flex-shrink: 0; }
  .colrule-del:hover { background: var(--danger-bg); color: var(--danger); }
  .colrule-conds { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; color: var(--text-sub); margin-top: 3px; }
  .colrule-conds span b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="preview-toolbar">
  <h1>Collection Rules Preview (variation, standalone)</h1>
  <button type="button" class="btn-action-primary" onclick="togglePreviewTheme()"><span>Toggle theme</span></button>
</div>

<div style="padding: 2px 2px 10px 2px;">
  <div class="settings-section-head">Collection Rules</div>
  <div class="settings-section-sub">File new clips into the right collection with one or more filters per rule</div>
</div>
<div class="notion-setting-group">
  <div class="notion-setting-row notion-row-stacked">
    <div class="setting-text-col">
      <div class="setting-title">New Collection Rule</div>
      <div class="setting-caption">Pick a target collection, then stack filters. Imaginary filters included for layout review.</div>
    </div>

    <!-- Target collection -->
    <div class="colrule-target-row">
      <span class="colrule-dot" id="targetDot" style="background: #3b82f6;"></span>
      <select id="colTarget" class="st-select" onchange="onTargetChange()" style="flex: 1;">
        <option value="projects" data-color="#3b82f6" selected>Projects</option>
        <option value="work" data-color="#f59e0b">Work</option>
        <option value="reading" data-color="#10b981">Reading</option>
      </select>
      <div class="colrule-match" id="matchToggle">
        <button type="button" class="active" onclick="setMatchMode('all', this)">Match all</button>
        <button type="button" onclick="setMatchMode('any', this)">Match any</button>
      </div>
    </div>

    <!-- Filter conditions -->
    <div id="condList"></div>
    <button type="button" class="colrule-add-link" onclick="addCond()">+ Add filter</button>

    <div class="colrule-summary" id="ruleSummary"></div>

    <div style="display: flex; justify-content: flex-end;">
      <button type="button" class="btn-action-primary" onclick="saveMockColRule()"><span>Save Rule</span></button>
    </div>
  </div>

  <!-- Existing rules -->
  <div class="auto-sort-rules-container" id="colRulesWrap" style="display: block; margin-top: 10px;">
    <div class="rules-item-list" id="colRulesList"></div>
  </div>
</div>

<script>
var FIELD_OPTS = [
  { v: 'app', label: 'Application' },
  { v: 'title', label: 'Window Title' },
  { v: 'url', label: 'URL / Domain' },
  { v: 'text', label: 'Text contains' },
  { v: 'kind', label: 'Clip type' },
  { v: 'time', label: 'Time of day' }
];
var OP_OPTS = [
  { v: 'is', label: 'is' },
  { v: 'contains', label: 'contains' },
  { v: 'matches', label: 'matches' }
];
var FIELD_PLACEHOLDER = {
  app: 'App name (e.g. code.exe)',
  title: 'Title keyword (e.g. *GitHub*)',
  url: 'Domain (e.g. notion.so)',
  text: 'Words that must appear in the clip',
  kind: 'text or image',
  time: 'e.g. 09:00 - 18:00'
};
var matchMode = 'all';
var condSeq = 0;
var conds = [];
var colRules = [
  { id: 'cr1', target: 'Projects', color: '#3b82f6', mode: 'all', filters: [{ f: 'app', op: 'is', val: 'code.exe' }, { f: 'text', op: 'contains', val: 'TODO' }] },
  { id: 'cr2', target: 'Reading', color: '#10b981', mode: 'any', filters: [{ f: 'url', op: 'contains', val: 'notion.so' }] }
];

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    if (ch === '&') return '&amp;';
    if (ch === '<') return '&lt;';
    if (ch === '>') return '&gt;';
    if (ch === '"') return '&quot;';
    return '&#39;';
  });
}
function fieldLabel(v) {
  for (var i = 0; i < FIELD_OPTS.length; i++) if (FIELD_OPTS[i].v === v) return FIELD_OPTS[i].label;
  return v;
}

function onTargetChange() {
  var sel = document.getElementById('colTarget');
  var dot = document.getElementById('targetDot');
  if (sel && dot) {
    var opt = sel.options[sel.selectedIndex];
    dot.style.background = (opt && opt.getAttribute('data-color')) || 'var(--accent)';
  }
  updateSummary();
}
function setMatchMode(mode, btn) {
  matchMode = mode;
  var wrap = document.getElementById('matchToggle');
  if (wrap) {
    var btns = wrap.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  }
  if (btn) btn.classList.add('active');
  updateSummary();
}
function addCond(preset) {
  var id = 'c' + (++condSeq);
  conds.push({ id: id, f: (preset && preset.f) || 'app', op: (preset && preset.op) || 'contains', val: (preset && preset.val) || '' });
  renderConds();
}
function removeCond(id) {
  conds = conds.filter(function (c) { return c.id !== id; });
  renderConds();
}
function renderConds() {
  var host = document.getElementById('condList');
  if (!host) return;
  host.innerHTML = '';
  conds.forEach(function (c) {
    var row = document.createElement('div');
    row.className = 'colrule-cond';
    var fOpts = FIELD_OPTS.map(function (o) {
      return '<option value="' + o.v + '"' + (o.v === c.f ? ' selected' : '') + '>' + o.label + '</option>';
    }).join('');
    var oOpts = OP_OPTS.map(function (o) {
      return '<option value="' + o.v + '"' + (o.v === c.op ? ' selected' : '') + '>' + o.label + '</option>';
    }).join('');
    row.innerHTML =
      '<select class="st-select field" data-cid="' + c.id + '" data-k="f">' + fOpts + '</select>' +
      '<select class="st-select op" data-cid="' + c.id + '" data-k="op">' + oOpts + '</select>' +
      '<input type="text" class="st-input" data-cid="' + c.id + '" data-k="val" placeholder="' + escapeHtml(FIELD_PLACEHOLDER[c.f] || '') + '" value="' + escapeHtml(c.val) + '">' +
      '<button type="button" class="colrule-del" title="Remove filter" onclick="removeCond(\'' + c.id + '\')">' +
        '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
      '</button>';
    host.appendChild(row);
  });
  var selects = host.querySelectorAll('select[data-cid], input[data-cid]');
  for (var i = 0; i < selects.length; i++) {
    (function (el) {
      el.addEventListener('change', function () {
        for (var j = 0; j < conds.length; j++) {
          if (conds[j].id === el.getAttribute('data-cid')) {
            conds[j][el.getAttribute('data-k')] = el.value;
            if (el.getAttribute('data-k') === 'f') renderConds();
            else updateSummary();
          }
        }
      });
      if (el.tagName === 'INPUT') el.addEventListener('input', function () {
        for (var j = 0; j < conds.length; j++) {
          if (conds[j].id === el.getAttribute('data-cid')) conds[j].val = el.value;
        }
        updateSummary();
      });
    })(selects[i]);
  }
  updateSummary();
}
function targetName() {
  var sel = document.getElementById('colTarget');
  if (!sel) return 'Projects';
  var opt = sel.options[sel.selectedIndex];
  return opt ? opt.text : sel.value;
}
function updateSummary() {
  var el = document.getElementById('ruleSummary');
  if (!el) return;
  if (!conds.length) {
    el.innerHTML = 'Add at least one filter to describe what goes into <strong>' + escapeHtml(targetName()) + '</strong>.';
    return;
  }
  var parts = conds.map(function (c) {
    return '<b>' + escapeHtml(fieldLabel(c.f)) + '</b> ' + escapeHtml(c.op) + ' <b>' + escapeHtml(c.val || '…') + '</b>';
  });
  el.innerHTML = 'Route to <strong>' + escapeHtml(targetName()) + '</strong> when ' + (matchMode === 'all' ? 'ALL' : 'ANY') + ' match: ' + parts.join(matchMode === 'all' ? ' + ' : ' / ');
}
function saveMockColRule() {
  if (!conds.length) return;
  var sel = document.getElementById('colTarget');
  var opt = sel ? sel.options[sel.selectedIndex] : null;
  colRules.push({
    id: 'cr' + Date.now().toString(36),
    target: opt ? opt.text : 'Projects',
    color: (opt && opt.getAttribute('data-color')) || '#3b82f6',
    mode: matchMode,
    filters: conds.map(function (c) { return { f: c.f, op: c.op, val: c.val }; })
  });
  conds = [];
  renderConds();
  renderColRules();
}
function renderColRules() {
  var list = document.getElementById('colRulesList');
  var wrap = document.getElementById('colRulesWrap');
  if (!list) return;
  list.innerHTML = '';
  if (!colRules.length) {
    if (wrap) wrap.style.display = 'none';
    return;
  }
  if (wrap) wrap.style.display = 'block';
  colRules.forEach(function (r) {
    var row = document.createElement('div');
    row.className = 'rule-item-row';
    var fHtml = r.filters.map(function (f) {
      return '<span><b>' + escapeHtml(fieldLabel(f.f)) + '</b> ' + escapeHtml(f.op) + ' <b>' + escapeHtml(f.val) + '</b></span>';
    }).join('');
    row.innerHTML =
      '<div class="rule-item-app">' +
        '<span class="colrule-dot" style="background: ' + r.color + ';"></span>' +
        '<div style="display: flex; flex-direction: column; gap: 1px;">' +
          '<span style="font-weight: 500;">' + escapeHtml(r.target) + '</span>' +
          '<span style="font-size: 9.5px; opacity: 0.85; text-transform: uppercase; font-weight: 600; letter-spacing: 0.3px;">' + r.mode + '</span>' +
        '</div>' +
        '<div class="colrule-conds">' + fHtml + '</div>' +
      '</div>' +
      '<div style="display: flex; align-items: center; gap: 8px;">' +
        '<button type="button" class="colrule-del" title="Delete rule" onclick="removeColRule(\'' + r.id + '\')">' +
          '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
        '</button>' +
      '</div>';
    list.appendChild(row);
  });
}
function removeColRule(id) {
  colRules = colRules.filter(function (r) { return r.id !== id; });
  renderColRules();
}
function togglePreviewTheme() {
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme') || 'dark';
  root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

addCond({ f: 'app', op: 'is', val: 'code.exe' });
renderColRules();
</script>
</body>
</html>
